version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chamadoshs_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: chamados_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_chamados.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chamadoshs_network

  # FastAPI Application
  api:
    build: .
    container_name: chamadoshs_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/chamados_db
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    # Mesma escolha do Dockerfile: /health (sem banco), porque este healthcheck
    # decide reinício, e reiniciar a API não conserta banco fora. Para saber se
    # o banco responde, use /api/v1/health — ver DEPLOY.md.
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    volumes:
      - ./:/app
    networks:
      - chamadoshs_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  chamadoshs_network:
    driver: bridge
